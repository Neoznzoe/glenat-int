server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Masquer la version de nginx
  server_tokens off;

  # ─── Headers de sécurité ───
  # Définis au niveau server : ils s'appliquent au document de l'app
  # (servi par `location /`, qui ne redéfinit aucun add_header).
  # ATTENTION : nginx ne cascade PAS add_header dans une location qui
  # possède son propre add_header. Les locations /health, /version.json
  # et /index.html (Cache-Control) ne reçoivent donc pas ces en-têtes ;
  # c'est sans impact sécurité (pas de contenu applicatif sensible).
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

  # CSP — démarrer en Report-Only pour ne pas casser la prod, puis basculer
  # sur Content-Security-Policy une fois zéro violation observée.
  add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.groupe-glenat.com; font-src 'self' data:; connect-src 'self' https://*.groupe-glenat.com https://login.microsoftonline.com https://*.microsoftonline.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

  # Compression
  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/xml+rss text/javascript image/svg+xml;
  gzip_min_length 1024;

  # Endpoint de healthcheck (séparé de version.json — sert juste à vérifier que Nginx est up)
  location = /health {
    access_log off;
    add_header Content-Type text/plain;
    add_header Cache-Control "no-store";
    return 200 "OK\n";
  }

  # SPA fallback pour React Router
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Assets immutables (Vite hash dans le nom — chemin /public/assets/ vu la config Vite legacy)
  location /public/assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # version.json toujours frais (utilisé par les healthchecks et le front)
  location = /version.json {
    add_header Cache-Control "no-store";
  }

  # index.html jamais en cache (pour récupérer les nouveaux hashs)
  location = /index.html {
    add_header Cache-Control "no-store";
  }
}
